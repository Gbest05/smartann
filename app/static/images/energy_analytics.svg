<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="16" fill="#0F172A"/>

  <!-- Analytics Container Card -->
  <rect x="40" y="40" width="520" height="370" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

  <!-- Metric Badges Top -->
  <g transform="translate(60, 60)">
    <rect width="140" height="60" rx="8" fill="#0F172A" border="1" stroke="#16A34A"/>
    <text x="12" y="24" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">MONTHLY BILL</text>
    <text x="12" y="48" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">&#8358;32,450</text>
  </g>

  <g transform="translate(220, 60)">
    <rect width="140" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
    <text x="12" y="24" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">AVERAGE USAGE</text>
    <text x="12" y="48" fill="#F59E0B" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">8.4 kWh/d</text>
  </g>

  <g transform="translate(380, 60)">
    <rect width="140" height="60" rx="8" fill="#0F172A" stroke="#22C55E"/>
    <text x="12" y="24" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">ANN FORECAST</text>
    <text x="12" y="48" fill="#22C55E" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">7.9 kWh</text>
  </g>

  <!-- Trend Graph Grid Lines -->
  <g stroke="#334155" stroke-width="1">
    <line x1="60" y1="160" x2="520" y2="160"/>
    <line x1="60" y1="220" x2="520" y2="220"/>
    <line x1="60" y1="280" x2="520" y2="280"/>
    <line x1="60" y1="340" x2="520" y2="340"/>
  </g>

  <!-- Area Fill & Trend Lines -->
  <path d="M 60,320 L 130,260 L 200,290 L 270,210 L 340,240 L 410,180 L 480,200 L 520,160 L 520,340 L 60,340 Z" fill="url(#chartArea)"/>
  <path d="M 60,320 L 130,260 L 200,290 L 270,210 L 340,240 L 410,180 L 480,200 L 520,160" fill="none" stroke="#22C55E" stroke-width="3.5"/>

  <!-- Peak Bars Indicator -->
  <g fill="#F59E0B" opacity="0.8">
    <rect x="125" y="260" width="10" height="80" rx="2"/>
    <rect x="265" y="210" width="10" height="130" rx="2"/>
    <rect x="405" y="180" width="10" height="160" rx="2"/>
  </g>

  <!-- Trend Dot Markers -->
  <circle cx="130" cy="260" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="270" cy="210" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="410" cy="180" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="520" cy="160" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>

  <!-- X-Axis Labels -->
  <text x="60" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Mon</text>
  <text x="130" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Tue</text>
  <text x="200" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Wed</text>
  <text x="270" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Thu</text>
  <text x="340" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Fri</text>
  <text x="410" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Sat</text>
  <text x="480" y="365" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Sun</text>
</svg>
