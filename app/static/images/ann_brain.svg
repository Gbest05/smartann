<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="#0B1120"/>

  <!-- Neural Network Topology Layers -->
  <!-- Layer 1 (Inputs) -->
  <g id="inputLayer">
    <line x1="100" y1="100" x2="260" y2="80" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="100" x2="260" y2="160" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="100" x2="260" y2="240" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    
    <line x1="100" y1="180" x2="260" y2="80" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="180" x2="260" y2="160" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="180" x2="260" y2="240" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="180" x2="260" y2="320" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>

    <line x1="100" y1="260" x2="260" y2="160" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="260" x2="260" y2="240" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="260" x2="260" y2="320" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>

    <line x1="100" y1="340" x2="260" y2="240" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
    <line x1="100" y1="340" x2="260" y2="320" stroke="#22C55E" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- Layer 2 to Layer 3 (Hidden to Hidden) -->
  <g id="hiddenLayer1">
    <line x1="260" y1="80" x2="420" y2="130" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="80" x2="420" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="160" x2="420" y2="130" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="160" x2="420" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="160" x2="420" y2="310" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="240" x2="420" y2="130" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="240" x2="420" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="240" x2="420" y2="310" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="320" x2="420" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
    <line x1="260" y1="320" x2="420" y2="310" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Layer 3 to Output -->
  <g id="outputConnections">
    <line x1="420" y1="130" x2="520" y2="220" stroke="#22C55E" stroke-width="2.5" opacity="0.8"/>
    <line x1="420" y1="220" x2="520" y2="220" stroke="#22C55E" stroke-width="3" opacity="0.9"/>
    <line x1="420" y1="310" x2="520" y2="220" stroke="#22C55E" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Node Circles Layer 1 (Input: Temporal, Appliances, Peak) -->
  <circle cx="100" cy="100" r="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <circle cx="100" cy="180" r="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <circle cx="100" cy="260" r="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <circle cx="100" cy="340" r="12" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <text x="40" y="225" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" transform="rotate(-90 40,225)">INPUT FEATURES</text>

  <!-- Node Circles Layer 2 (Hidden 1: 64 Neurons) -->
  <circle cx="260" cy="80" r="14" fill="#15803D" stroke="#22C55E" stroke-width="2"/>
  <circle cx="260" cy="160" r="14" fill="#15803D" stroke="#22C55E" stroke-width="2"/>
  <circle cx="260" cy="240" r="14" fill="#15803D" stroke="#22C55E" stroke-width="2"/>
  <circle cx="260" cy="320" r="14" fill="#15803D" stroke="#22C55E" stroke-width="2"/>
  <text x="260" y="380" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HIDDEN LAYER 1 (ReLU)</text>

  <!-- Node Circles Layer 3 (Hidden 2: 32 Neurons) -->
  <circle cx="420" cy="130" r="14" fill="#D97706" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="420" cy="220" r="14" fill="#D97706" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="420" cy="310" r="14" fill="#D97706" stroke="#F59E0B" stroke-width="2"/>
  <text x="420" y="380" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HIDDEN LAYER 2</text>

  <!-- Output Node (Predicted Demand kWh) -->
  <circle cx="520" cy="220" r="18" fill="#22C55E" stroke="#FFFFFF" stroke-width="3" filter="url(#glowEffect)"/>
  <text x="520" y="270" fill="#22C55E" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PREDICTED kWh</text>

  <!-- Floating Accuracy Header -->
  <g transform="translate(30, 25)">
    <rect width="240" height="40" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="1.2"/>
    <text x="15" y="25" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">ANN MODEL ACCURACY: 99.2%</text>
  </g>
</svg>
