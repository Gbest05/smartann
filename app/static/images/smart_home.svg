<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="450" rx="16" fill="#0F172A"/>

  <!-- Smart Home Isometric Outline -->
  <polygon points="300,70 500,170 300,270 100,170" fill="url(#roofGrad)" opacity="0.9"/>
  <polygon points="100,170 300,270 300,380 100,280" fill="url(#wallGrad)"/>
  <polygon points="500,170 300,270 300,380 500,280" fill="#1E293B"/>

  <!-- Rooftop Solar / Energy Capture Grid Cells -->
  <g fill="url(#solarGrad)" stroke="#10B981" stroke-width="1.5" opacity="0.85">
    <polygon points="260,110 330,145 310,185 240,150"/>
    <polygon points="340,150 410,185 390,225 320,190"/>
    <polygon points="190,145 260,180 240,220 170,185"/>
  </g>

  <!-- Smart Energy Monitoring Flow Signals -->
  <!-- Central Pulse Hub -->
  <circle cx="300" cy="270" r="16" fill="#22C55E" filter="url(#softGlow)"/>
  <circle cx="300" cy="270" r="7" fill="#FFFFFF"/>

  <!-- Energy Telemetry Data Lines -->
  <path d="M 300,270 L 450,330" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="450" cy="330" r="10" fill="#F59E0B"/>
  <text x="470" y="335" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Peak Load Control</text>

  <path d="M 300,270 L 150,330" stroke="#22C55E" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="150" cy="330" r="10" fill="#22C55E"/>
  <text x="50" y="335" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">AI Demand Forecast</text>

  <!-- Energy Wave Arcs -->
  <path d="M 230,235 A 80,80 0 0,1 370,235" fill="none" stroke="#22C55E" stroke-width="2.5" opacity="0.8"/>
  <path d="M 200,220 A 120,120 0 0,1 400,220" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5"/>

  <!-- Floating Stats Badge -->
  <g transform="translate(390, 80)">
    <rect width="180" height="60" rx="10" fill="#1E293B" stroke="#16A34A" stroke-width="1.5"/>
    <text x="15" y="26" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">ESTIMATED EFFICIENCY</text>
    <text x="15" y="48" fill="#22C55E" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">+28.4% Savings</text>
  </g>
</svg>
